[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thurbox-accounts"
version = "0.5.0"
description = "Standalone Claude Enterprise account switching for Thurbox"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
thurbox-accounts = "thurbox_accounts.cli:main"
thurbox-accounts-agent = "thurbox_accounts.guard:main"

[tool.setuptools.packages.find]
include = ["thurbox_accounts*"]

[tool.setuptools.package-data]
thurbox_accounts = ["ui/*.lua"]
